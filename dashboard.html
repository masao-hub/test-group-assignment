<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Stats Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>⚽ Football Stats Dashboard</h1>
            <nav>
                <button id="logoutBtn">Logout</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Search players or teams...">
                <button id="searchBtn">Search</button>
            </div>
            <div class="favorites-section">
                <h3>My Favorites</h3>
                <ul id="favoritesList"></ul>
            </div>
        </aside>

        <main class="content">
            <div class="tabs">
                <button class="tab-btn active" data-tab="players">Players</button>
                <button class="tab-btn" data-tab="teams">Teams</button>
                <button class="tab-btn" data-tab="matches">Matches</button>
            </div>

            <div id="players" class="tab-content active">
                <h2>Top Players</h2>
                <div class="players-grid" id="playersGrid"></div>
            </div>

            <div id="teams" class="tab-content">
                <h2>Top Teams</h2>
                <div class="teams-grid" id="teamsGrid"></div>
            </div>

            <div id="matches" class="tab-content">
                <h2>Recent Matches</h2>
                <div class="matches-list" id="matchesList"></div>
            </div>
        </main>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="playerDetails"></div>
        </div>
    </div>

    <div id="teamModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="teamDetails"></div>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
